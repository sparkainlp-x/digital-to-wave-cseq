name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (warnings are errors)
        run: python -m pytest -q
      - name: Legacy script tests
        run: python tests.py
      - name: Demo seeds 7 and 42
        run: |
          python demo.py --seed 7
          python demo.py --seed 42
          python demo_verified.py --seed 7
          python demo_verified.py --seed 42
      - name: Sweep results reproduce byte for byte
        run: |
          python experiments/capacity_sweep.py > /dev/null
          python experiments/cue_gate_sweep.py > /dev/null
          git diff --exit-code results/
