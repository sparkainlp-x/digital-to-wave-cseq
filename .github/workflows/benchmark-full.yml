name: Benchmark (full, manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Full rigorous benchmark (timings are specific to this shared runner)
        run: python benchmark_rigorous.py --full --json report_rigorous.json
      - name: Full round-2 benchmark (denoising, load-controlled scaling, complex64 at N=16384 if memory allows)
        run: python benchmark_round2.py --full --json report_round2.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark_reports
          path: |
            report_rigorous.json
            report_round2.json
